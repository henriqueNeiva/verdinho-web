<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#191d21">
<meta name="color-scheme" content="dark light">
<meta name="google-site-verification" content="k5udXKTHvbIocFw5ZtnE6rCjXxYw_ZJ_EunWR8A3q1E">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Verdinho Finanças">
<meta name="application-name" content="Verdinho Finanças">
<meta property="og:locale" content="pt_BR">
{{canonical}}
<link rel="icon" type="image/png" sizes="48x48" href="{{prefix}}assets/favicon.png">
<link rel="apple-touch-icon" href="{{prefix}}assets/logo.png">
<link rel="stylesheet" href="{{prefix}}assets/styles.css">
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header wrap">
<a class="brand" href="{{prefix}}" aria-label="Verdinho Finanças — início"><img src="{{prefix}}assets/symbol.png" width="56" height="56" alt=""><span>verdinho<span class="brand-sub">FINANÇAS</span></span></a>
<nav aria-label="Navegação principal"><a href="{{prefix}}"{{currentHome}}>O aplicativo</a><a href="{{prefix}}privacidade/">Privacidade</a><a href="{{prefix}}suporte/"{{currentSupport}}>Suporte <span aria-hidden="true">↗</span></a></nav>
</header>
<main id="conteudo">{{body}}</main>
<footer class="site-footer wrap">
<div><a class="brand footer-brand" href="{{prefix}}"><img src="{{prefix}}assets/symbol.png" width="44" height="44" alt=""><span>verdinho</span></a><p>Uma relação mais leve com o seu dinheiro.</p></div>
<nav aria-label="Informações institucionais"><a href="{{prefix}}privacidade/">Privacidade</a><a href="{{prefix}}termos/">Termos de uso</a><a href="{{prefix}}suporte/">Suporte</a><a href="{{prefix}}excluir-conta/">Excluir conta</a><a href="{{prefix}}licencas/">Licenças</a></nav>
<div class="footer-bottom"><span>© 2026 Verdinho Finanças</span><span>Feito para a vida real.</span></div>
</footer>
</body></html>
